name: CI

on:
  push:
    branches:
      - master
      - chore/2026-uplift*
  pull_request:
    types: [opened, synchronize, reopened]

# Reset permissions and grant them per job.
permissions: {}

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # to check out repo (actions/checkout)
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Use LF EOL
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The parent commit too, for the size comparison. On pull requests
          # HEAD is a merge commit, so HEAD^1 is the base it merged onto.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check
        if: matrix.os == 'ubuntu-latest'
        run: pnpm check
      # Report only: adds the size table to the job summary, never fails.
      - name: Size
        if: always() && matrix.os == 'ubuntu-latest'
        run: pnpm size --base HEAD^1
      # Format, lint and the packed tarball don't depend on the OS, so Windows
      # only runs the tests.
      - name: Test
        if: matrix.os == 'windows-latest'
        run: pnpm test
